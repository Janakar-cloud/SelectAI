# SelectAI — nginx site config
# Server path: /var/www/SelectAI
# Install: sudo bash deploy/fix-homepage.sh

server {
    listen 80;
    listen [::]:80;
    server_name selectai.com www.selectai.com selectai.it.com www.selectai.it.com;
    access_log /var/log/nginx/selectai-access.log;
    error_log  /var/log/nginx/selectai-error.log;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name selectai.com www.selectai.com selectai.it.com www.selectai.it.com;

    root /var/www/SelectAI;
    index index.html;

    access_log /var/log/nginx/selectai-access.log;
    error_log  /var/log/nginx/selectai-error.log;

    ssl_certificate     /etc/letsencrypt/live/selectai.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/selectai.it.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /var/www/SelectAI/deploy/nginx-urls.snippet;
    # Or paste deploy/nginx-urls.snippet contents here if include path differs

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
