# SelectAI — nginx site config
# Copy to /etc/nginx/sites-available/selectai and enable it.
# Set root to your deployed static files directory.

server {
    listen 80;
    listen [::]:80;
    server_name selectai.com www.selectai.com selectai.it.com www.selectai.it.com;

    root /var/www/selectai;
    index index.html;

    # Always serve the marketing homepage at /
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
