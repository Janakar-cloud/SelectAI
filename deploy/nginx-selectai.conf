# SelectAI — nginx site config
# Server path: /var/www/SelectAI
# Install: sudo bash deploy/fix-homepage.sh

# HTTP → HTTPS (adjust server_name if needed)
server {
    listen 80;
    listen [::]:80;
    server_name selectai.com www.selectai.com selectai.it.com www.selectai.it.com;

    access_log /var/log/nginx/selectai-access.log;
    error_log  /var/log/nginx/selectai-error.log;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name selectai.com www.selectai.com selectai.it.com www.selectai.it.com;

    root /var/www/SelectAI;
    index index.html;

    access_log /var/log/nginx/selectai-access.log;
    error_log  /var/log/nginx/selectai-error.log;

    # Certbot / Let's Encrypt (paths may differ — run: sudo certbot certificates)
    ssl_certificate     /etc/letsencrypt/live/www.selectai.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.selectai.it.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Homepage at domain root — never login.html or signin.html
    location = / {
        try_files /index.html =404;
    }

    # Static files (HTML, CSS, JS, images)
    location / {
        try_files $uri $uri/ =404;
    }

    # API → Node.js (PM2 on port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

