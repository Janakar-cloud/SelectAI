<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none" role="img" aria-label="SelectAI logo">
  <defs>
    <!-- Gradient for "AI" text -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00f5ff"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2d78"/>
    </linearGradient>
    <!-- Gradient for bracket strokes -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#00f5ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Icon gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- ── Corner bracket: top-left ── -->
  <polyline points="4,14  4,4  14,4"   stroke="url(#bracketGrad)" stroke-width="2.2" stroke-linecap="square"/>
  <!-- ── Corner bracket: top-right ── -->
  <polyline points="206,4  216,4  216,14" stroke="url(#bracketGrad)" stroke-width="2.2" stroke-linecap="square"/>
  <!-- ── Corner bracket: bottom-left ── -->
  <polyline points="4,42   4,52  14,52"  stroke="url(#bracketGrad)" stroke-width="2.2" stroke-linecap="square"/>
  <!-- ── Corner bracket: bottom-right ── -->
  <polyline points="206,52 216,52 216,42" stroke="url(#bracketGrad)" stroke-width="2.2" stroke-linecap="square"/>

  <!-- ── Chip / circuit icon (left side) ── -->
  <!-- Outer rect -->
  <rect x="12" y="18" width="20" height="20" rx="2" stroke="url(#iconGrad)" stroke-width="1.5" fill="none"/>
  <!-- Inner grid lines -->
  <line x1="12" y1="24" x2="32" y2="24" stroke="url(#iconGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="12" y1="28" x2="32" y2="28" stroke="url(#iconGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="12" y1="32" x2="32" y2="32" stroke="url(#iconGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="18" x2="18" y2="38" stroke="url(#iconGrad)" stroke-width="0.8" opacity="0.6"/>
  <line x1="24" y1="18" x2="24" y2="38" stroke="url(#iconGrad)" stroke-width="0.8" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="22" cy="28" r="2.5" fill="url(#iconGrad)" opacity="0.9"/>
  <!-- Lead lines -->
  <line x1="16" y1="18" x2="16" y2="12" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="22" y1="18" x2="22" y2="12" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="28" y1="18" x2="28" y2="12" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="16" y1="38" x2="16" y2="44" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="22" y1="38" x2="22" y2="44" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="28" y1="38" x2="28" y2="44" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="12" y1="22" x2="8"  y2="22" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="12" y1="28" x2="8"  y2="28" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="12" y1="34" x2="8"  y2="34" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="32" y1="22" x2="36" y2="22" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="32" y1="28" x2="36" y2="28" stroke="url(#iconGrad)" stroke-width="1.2"/>
  <line x1="32" y1="34" x2="36" y2="34" stroke="url(#iconGrad)" stroke-width="1.2"/>

  <!-- ── Wordmark ── -->
  <!-- "Select" in white -->
  <text
    x="44" y="36"
    font-family="Orbitron, 'Courier New', monospace"
    font-weight="700"
    font-size="21"
    letter-spacing="1"
    fill="#ffffff"
    filter="url(#glow)"
  >Select</text>

  <!-- "AI" in gradient -->
  <text
    x="148" y="36"
    font-family="Orbitron, 'Courier New', monospace"
    font-weight="900"
    font-size="21"
    letter-spacing="1"
    fill="url(#aiGrad)"
    filter="url(#glow)"
  >AI</text>

  <!-- ── Thin accent line under wordmark ── -->
  <line x1="44" y1="40" x2="176" y2="40" stroke="url(#bracketGrad)" stroke-width="1" opacity="0.5"/>

  <!-- ── Diagonal tick marks (retro style) ── -->
  <line x1="180" y1="44" x2="185" y2="38" stroke="#00f5ff" stroke-width="1.2" opacity="0.7"/>
  <line x1="185" y1="44" x2="190" y2="38" stroke="#a855f7" stroke-width="1.2" opacity="0.7"/>
  <line x1="190" y1="44" x2="195" y2="38" stroke="#ff2d78" stroke-width="1.2" opacity="0.7"/>
</svg>
